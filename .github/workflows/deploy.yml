name: Deploy static content to Pages

on:
  push:
    branches: ['main']

  workflow_dispatch:
    inputs:
      send_catalog:
        description: 'Kataloğu alıcılara e-posta ile gönder'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify Pages output contains no PDFs
        run: node scripts/check-pages-output.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Generate catalog outside Pages output
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_catalog }}
        env:
          CATALOG_OUTPUT: ${{ runner.temp }}/sarioglu-kapi-katalogu.pdf
        run: node scripts/generate-catalog.mjs

      - name: Email catalog
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_catalog }}
        env:
          CATALOG_OUTPUT: ${{ runner.temp }}/sarioglu-kapi-katalogu.pdf
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
        run: node scripts/send-catalog.mjs

      - name: Remove temporary catalog
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.send_catalog }}
        env:
          CATALOG_OUTPUT: ${{ runner.temp }}/sarioglu-kapi-katalogu.pdf
        run: rm -f -- "$CATALOG_OUTPUT"
